{% extends "core/base.html" %}

{% block content %}
<div class="d-flex align-items-center justify-content-center" style="min-height: 80vh;">
    
    <div class="panel p-5 shadow-lg text-center" style="max-width: 400px; width: 100%;">
        
        <div class="mb-4">
            <i class="bi bi-person-circle text-primary" style="font-size: 4rem;"></i>
            <h2 class="fw-bold text-primary mt-3">Bem-vindo</h2>
            <p class="text-secondary">Insira suas credenciais para acessar.</p>
        </div>

        <form method="post">
            {% csrf_token %}
            
            {% if form.errors %}
            <div class="alert alert-danger py-2 small mb-3">
                Usuário ou senha incorretos.
            </div>
            {% endif %}

            <div class="form-floating mb-3">
                <input type="text" name="username" class="form-control" id="id_username" placeholder="Usuário" required autofocus>
                <label for="id_username">Usuário</label>
            </div>

            <div class="form-floating mb-4">
                <input type="password" name="password" class="form-control" id="id_password" placeholder="Senha" required>
                <label for="id_password">Senha</label>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-3 fw-bold rounded-pill shadow-sm">
                ENTRAR NO SISTEMA
            </button>
            
            <input type="hidden" name="next" value="{{ next }}">
        </form>
        
        <div class="mt-4 pt-3 border-top">
            <small class="text-muted">Emporikos &copy; 2025</small>
        </div>
    </div>

</div>
{% endblock %}
