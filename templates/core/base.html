{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Emporikos{% endblock %}</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <style>
      :root {
        /* PALETA AZUL E BRANCO */
        --surface-color: rgba(255, 255, 255, 0.92); /* Fundo dos cards branco semi-transparente */
        --border-color: #cfe2ff; /* Borda azul bem clarinha */
        
        --text-primary: #0a2540; /* Azul marinho escuro para texto principal */
        --text-secondary: #556b8d; /* Azul acinzentado para textos secundários */
        
        --accent-color: #0d6efd; /* Azul vibrante para destaques (botões, ícones) */
        --accent-hover: #0b5ed7;
      }

      body {
        /* Configuração da Imagem de Fundo */
        background: url('{% static "img/paisagem.jpg" %}') no-repeat center center fixed;
        background-size: cover; /* Faz a imagem cobrir toda a tela */
        
        color: var(--text-primary);
        font-family: "Inter", sans-serif;
        min-height: 100vh;
      }

      /* Navbar com gradiente azul */
      .navbar {
        background: linear-gradient(90deg, #0a2540 0%, #1a3c61 100%);
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        border-bottom: 1px solid rgba(255,255,255,0.1);
      }
      .navbar-brand { font-weight: 700; letter-spacing: 0.5px; color: #fff !important; }
      .nav-link { color: rgba(255,255,255,0.85) !important; }
      .nav-link:hover, .nav-link.active { color: #fff !important; }

      /* Estilos Gerais */
      .text-accent { color: var(--accent-color) !important; }
      main { padding: 30px 20px; }
      
      /* Paineis (Cards) - Agora brancos e limpos */
      .panel {
        background: var(--surface-color);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        padding: 20px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.05); /* Sombra suave */
        backdrop-filter: blur(5px); /* Efeito de vidro fosco */
      }
      .panel-label {
        font-size: 13px;
        color: var(--text-secondary);
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        margin-bottom: 8px;
      }
      .panel-value {
        font-size: 32px;
        font-weight: 700;
        color: var(--text-primary); /* Azul escuro */
      }
      
      /* Ajustes para tabelas no tema claro */
      .table { --bs-table-bg: transparent; color: var(--text-primary); }
      .table thead th { 
          color: var(--text-secondary); 
          font-weight: 600; 
          border-bottom: 2px solid var(--border-color);
      }
      .table td { border-bottom: 1px solid var(--border-color); }
      
      /* Ajustes de inputs para o tema claro */
      .form-control, .form-select {
        background-color: #fff;
        border: 1px solid #ced4da;
        color: var(--text-primary);
      }
      .form-control:focus {
        border-color: var(--accent-color);
        box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg">
      <div class="container-fluid">
        <a class="navbar-brand" href="/">
          <i class="bi bi-cloud-sun-fill me-2 text-warning"></i>Gestão Aviamentos
        </a>
        
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarMain">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
                <a class="nav-link" href="{% url 'frente_caixa' %}">
                    <i class="bi bi-cart me-1"></i> Caixa
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="{% url 'cadastro_produto' %}">
                    <i class="bi bi-plus-circle me-1"></i> Novo Produto
                </a>
            </li>
            <li class="nav-item ms-3">
              <a class="btn btn-sm btn-light text-primary fw-bold" href="/admin/">
                <i class="bi bi-gear-fill me-1"></i> Admin
              </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="{% url 'relatorio_vendas' %}">
                    <i class="bi bi-file-earmark-text me-1"></i> Relatórios
                </a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main>
      {% block content %}{% endblock content %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock scripts %}
  </body>
</html>
