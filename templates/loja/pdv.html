{% extends "core/base.html" %}

{% block content %}
<input type="hidden" id="venda_id" value="{{ venda.id }}">
{% csrf_token %} 

<div class="row h-100">
    <div class="col-md-8 d-flex flex-column gap-3">
        
        <div class="panel" style="position: relative;"> 
            <label class="panel-label mb-2">Buscar Produto (Venda #{{ venda.id }})</label>
            <div class="input-group input-group-lg position-relative">
                <span class="input-group-text bg-primary text-white border-primary">
                    <i class="bi bi-search"></i>
                </span>
                <input type="text" id="input-busca" class="form-control border-primary" 
                    placeholder="Digite o código ou nome..." 
                    autocomplete="off" autofocus>
                
                <ul id="lista-sugestoes" class="list-group position-absolute w-100 shadow-lg" 
                    style="top: 100%; left: 0; display: none; max-height: 300px; overflow-y: auto; z-index: 1050;">
                </ul>
            </div>
        </div>

        <div class="panel flex-grow-1 d-flex flex-column p-0" style="overflow: hidden; min-height: 400px; z-index: 1;">
            <div class="p-3 border-bottom d-flex justify-content-between align-items-center bg-light bg-opacity-50">
                <span class="fw-bold text-primary"><i class="bi bi-cart3 me-2"></i>Itens da Venda</span>
                <span class="badge bg-primary rounded-pill" id="total-itens-badge">0 itens</span>
            </div>
            <div class="table-responsive flex-grow-1">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light sticky-top">
                        <tr>
                            <th class="ps-4" style="width: 100px;">Código</th> <th>Produto</th>
                            <th class="text-center">Qtd</th>
                            <th class="text-end">Unitário</th>
                            <th class="text-end">Total</th>
                            <th class="text-center">Ação</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-itens">
                        </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="col-md-4 d-flex flex-column">
        <div class="panel h-100 d-flex flex-column justify-content-between">
            <div class="text-end mb-4">
                <small class="panel-label d-block">Subtotal</small>
                <h1 class="display-4 fw-bold text-primary" id="visor-total">R$ 0,00</h1>
            </div>

            <div class="d-grid gap-2">
                <button class="btn btn-primary btn-lg py-3 shadow-sm" onclick="irParaCheckout()">
                    <i class="bi bi-arrow-right-circle-fill me-2"></i> AVANÇAR P/ PAGAMENTO (F2)
                </button>
                
                <button class="btn btn-outline-danger btn-lg py-3" onclick="limparVenda()">
                    <i class="bi bi-trash me-2"></i> Limpar
                </button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    const VENDA_ID = document.getElementById('venda_id').value;
    const CSRF_TOKEN = document.querySelector('[name=csrfmiddlewaretoken]').value;
    
    // --- 1. ESTADO INICIAL (Sincronizado com o Banco) ---
    let carrinho = [
        {% for item in itens %}
        {
            id_item_venda: {{ item.id }},
            codigo: "{{ item.produto.codigo }}",
            nome: "{{ item.produto.nome }}",
            detalhes: "{{ item.produto.detalhes|default_if_none:'' }}",
            tipo: "{{ item.produto.tipo_venda }}", 
            preco: {{ item.preco_unitario|stringformat:".2f" }}, 
            quantidade: {{ item.quantidade|stringformat:".3f" }}
        },
        {% endfor %}
    ];

    // Inicializa a tabela ao abrir
    renderizarTabela();

    // --- 2. LÓGICA DE BUSCA ---
    let timeoutBusca = null;
    const inputBusca = document.getElementById('input-busca');
    const listaSugestoes = document.getElementById('lista-sugestoes');

    inputBusca.addEventListener('input', function() {
        const termo = this.value.trim();
        clearTimeout(timeoutBusca);
        if (termo.length < 1) { 
            listaSugestoes.style.display = 'none'; 
            return; 
        }
        timeoutBusca = setTimeout(() => carregarSugestoes(termo), 300);
    });

    inputBusca.addEventListener('keypress', async function (e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            const termo = this.value.trim();
            if(!termo) return;
            
            const response = await fetch(`/api/buscar-produto/?termo=${encodeURIComponent(termo)}`);
            const dados = await response.json();

            if (dados.length === 0) {
                alert("Produto não encontrado!");
                listaSugestoes.style.display = 'none';
            } else if (dados.length === 1) {
                adicionarAoCarrinho(dados[0]);
            } else {
                desenharLista(dados);
            }
        }
    });

    async function carregarSugestoes(termo) {
        try {
            const response = await fetch(`/api/buscar-produto/?termo=${encodeURIComponent(termo)}`);
            const dados = await response.json();
            desenharLista(dados);
        } catch (e) { console.error(e); }
    }

    function desenharLista(produtos) {
        listaSugestoes.innerHTML = '';
        if (produtos.length === 0) { 
            listaSugestoes.style.display = 'none'; 
            return; 
        }
        
        produtos.forEach(p => {
            const li = document.createElement('li');
            li.className = 'list-group-item list-group-item-action d-flex justify-content-between cursor-pointer';
            li.onclick = () => { adicionarAoCarrinho(p); };
            
            li.innerHTML = `
                <div>
                    <strong>${p.nome}</strong> 
                    <span class="badge bg-light text-secondary border ms-1" style="font-size: 0.7em;">${p.tipo || 'UN'}</span>
                    <br><small>${p.codigo}</small>
                </div>
                <span class="fw-bold">R$ ${p.preco.toFixed(2)}</span>
            `;
            listaSugestoes.appendChild(li);
        });
        listaSugestoes.style.display = 'block';
    }

    document.addEventListener('click', e => { 
        if (!inputBusca.contains(e.target) && !listaSugestoes.contains(e.target)) {
            listaSugestoes.style.display = 'none';
        }
    });

    // --- 3. FUNÇÕES DE REDE ---
    
    async function adicionarAoCarrinho(produto) {
        try {
            const response = await fetch(`/api/pdv/adicionar/${VENDA_ID}/`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-CSRFToken': CSRF_TOKEN },
                body: JSON.stringify({ codigo: produto.codigo })
            });

            if (response.ok) {
                inputBusca.value = '';
                listaSugestoes.style.display = 'none';
                inputBusca.focus();
                window.location.reload(); 
            } else {
                alert('Erro ao salvar item.');
            }
        } catch (error) { alert("Erro de conexão."); }
    }

    async function removerNoServidor(itemVendaId) {
        const response = await fetch(`/api/pdv/remover/${itemVendaId}/`, {
            method: 'POST', headers: {'X-CSRFToken': CSRF_TOKEN}
        });
        if (response.ok) window.location.reload();
    }

    async function atualizarQtdServidor(itemVendaId, novaQtd) {
        try {
            await fetch(`/api/pdv/atualizar-qtd/${itemVendaId}/`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-CSRFToken': CSRF_TOKEN },
                body: JSON.stringify({ quantidade: novaQtd }),
                keepalive: true
            });
        } catch (e) {
            console.error("Erro ao salvar quantidade:", e);
        }
    }

    async function limparVenda() {
        const response = await fetch(`/api/pdv/limpar/${VENDA_ID}/`, {
            method: 'POST', headers: {'X-CSRFToken': CSRF_TOKEN}
        });
        if (response.ok) window.location.reload();
    }

    // --- 4. RENDERIZAÇÃO DA TABELA ---

    function renderizarTabela() {
        const tbody = document.getElementById('tabela-itens');
        tbody.innerHTML = '';
        let total = 0;
        let qtdItens = 0;

        carrinho.forEach(item => {
            const subtotal = item.preco * item.quantidade;
            total += subtotal;
            qtdItens += 1;

            let step, min;
            if (item.tipo === 'UN') {
                step = '1'; min = '1';
            } else {
                step = '0.001'; min = '0.001';
            }

            tbody.innerHTML += `
            <tr>
                <td class="ps-4 fw-bold text-secondary font-monospace" style="vertical-align: middle;">
                    ${item.codigo}
                </td>

                <td>
                    <div class="d-flex align-items-center">
                        <span class="fw-bold text-dark me-2">${item.nome}</span>
                        <span class="badge bg-light text-secondary border" style="font-size: 0.7em;">${item.tipo}</span>
                    </div>
                    ${ item.detalhes ? `<small class="text-muted fst-italic" style="display:block; margin-top:2px;">${item.detalhes}</small>` : '' }
                </td>

                <td class="text-center" style="vertical-align: middle;">
                    <input type="number" step="${step}" min="${min}"
                           class="form-control form-control-sm text-center d-inline-block border-secondary input-qtd" 
                           style="width: 80px;"
                           value="${item.quantidade}"
                           onchange="atualizarLocalEBackend(${item.id_item_venda}, this.value, '${item.tipo}')">
                </td>

                <td class="text-end text-muted" style="vertical-align: middle;">
                    R$ ${item.preco.toFixed(2)}
                </td>

                <td class="text-end fw-bold text-primary" style="vertical-align: middle;">
                    R$ ${subtotal.toFixed(2)}
                </td>

                <td class="text-center" style="vertical-align: middle;">
                    <button class="btn btn-sm btn-light text-danger border-0" onclick="removerNoServidor(${item.id_item_venda})">
                        <i class="bi bi-trash"></i>
                    </button>
                </td>
            </tr>`;
        });

        const totalFmt = total.toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
        document.getElementById('visor-total').innerText = totalFmt;
        document.getElementById('total-itens-badge').innerText = `${qtdItens} itens`;
    }

    function atualizarLocalEBackend(id, qtd, tipo) {
        let novaQtd = parseFloat(qtd);
        if (tipo === 'UN' && !Number.isInteger(novaQtd)) {
            alert("Apenas valores inteiros para UN");
            window.location.reload(); 
            return;
        }
        
        const item = carrinho.find(i => i.id_item_venda === id);
        if(item) {
            item.quantidade = novaQtd;
            // Atualiza UI localmente para feedback instantâneo
            renderizarTabela(); 
            // Salva no banco
            atualizarQtdServidor(id, novaQtd);
        }
    }

    // --- NOVA FUNÇÃO DE CHECKOUT ---
    function irParaCheckout() {
        if (carrinho.length === 0) {
            alert("O carrinho está vazio!\nAdicione produtos antes de ir para o pagamento.");
            return;
        }

        // 1. Força a perda de foco de qualquer input ativo
        if (document.activeElement) {
            document.activeElement.blur();
        }

        // 2. Pequeno delay e redirecionamento
        setTimeout(() => {
            window.location.href = "{% url 'checkout' venda_id=venda.id %}";
        }, 300);
    }

    document.addEventListener('keydown', function(e) {
    if (e.key === 'F2') {
        e.preventDefault(); // Evita o comportamento padrão da tecla no navegador
        irParaCheckout();   // Chama a função que já existe no seu código
    }
    });

</script>
{% endblock %}
