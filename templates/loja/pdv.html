{% extends "core/base.html" %}

{% block content %}
<div class="row h-100">
    <div class="col-md-8 d-flex flex-column gap-3">
        
        <div class="panel" style="position: relative; z-index: 1050;">
            <label class="panel-label mb-2">Buscar Produto</label>
            <div class="input-group input-group-lg position-relative">
                <span class="input-group-text bg-primary text-white border-primary">
                    <i class="bi bi-search"></i>
                </span>
                <input type="text" id="input-busca" class="form-control border-primary" 
                       placeholder="Digite o código ou nome..." 
                       autocomplete="off" autofocus>
                
                <ul id="lista-sugestoes" class="list-group position-absolute w-100 shadow-lg" 
                    style="top: 100%; left: 0; display: none; max-height: 300px; overflow-y: auto;">
                </ul>
            </div>
        </div>

        <div class="panel flex-grow-1 d-flex flex-column p-0" style="overflow: hidden; min-height: 400px; z-index: 1;">
            <div class="p-3 border-bottom d-flex justify-content-between align-items-center bg-light bg-opacity-50">
                <span class="fw-bold text-primary"><i class="bi bi-cart3 me-2"></i>Cupom de Venda</span>
                <span class="badge bg-primary rounded-pill" id="total-itens-badge">0 itens</span>
            </div>
            <div class="table-responsive flex-grow-1">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light sticky-top">
                        <tr>
                            <th>#</th>
                            <th>Produto</th>
                            <th class="text-center">Qtd</th>
                            <th class="text-end">Unitário</th>
                            <th class="text-end">Total</th>
                            <th class="text-center">Ação</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-itens"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="col-md-4 d-flex flex-column">
        <div class="panel h-100 d-flex flex-column justify-content-between">
            <div class="text-end mb-4">
                <small class="panel-label d-block">Subtotal</small>
                <h1 class="display-4 fw-bold text-primary" id="visor-total">R$ 0,00</h1>
            </div>

            <div class="bg-light bg-opacity-75 p-3 rounded border mb-3">
                <div class="d-flex justify-content-between text-primary fw-bold fs-5">
                    <span>Total</span>
                    <span id="resumo-total">R$ 0,00</span>
                </div>
            </div>

            <div class="d-grid gap-2">
                <button class="btn btn-primary btn-lg py-3 shadow-sm" onclick="finalizarVenda()">
                    <i class="bi bi-arrow-right-circle-fill me-2"></i> AVANÇAR P/ PAGAMENTO (F2)
                </button>
                <button class="btn btn-outline-danger" onclick="limparCarrinho()">
                    <i class="bi bi-trash me-2"></i> Cancelar
                </button>
            </div>
        </div>
    </div>
</div>

{% endblock %}

{% block scripts %}
<script>
    let carrinho = [];
    let timeoutBusca = null;
    const inputBusca = document.getElementById('input-busca');
    const listaSugestoes = document.getElementById('lista-sugestoes');

    // 1. Busca e Autocomplete
    inputBusca.addEventListener('input', function() {
        const termo = this.value.trim();
        clearTimeout(timeoutBusca);
        if (termo.length < 1) { listaSugestoes.style.display = 'none'; return; }
        timeoutBusca = setTimeout(() => carregarSugestoes(termo), 300);
    });

    inputBusca.addEventListener('keypress', async function (e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            const termo = this.value.trim();
            if(!termo) return;
            const response = await fetch(`/api/buscar-produto/?termo=${termo}`);
            const dados = await response.json();

            if (dados.length === 0) {
                alert("Produto não encontrado!");
                listaSugestoes.style.display = 'none';
                return;
            }
            // Prioridade para código exato
            const exato = dados.find(p => p.codigo.toLowerCase() === termo.toLowerCase());
            if (exato) { adicionarAoCarrinho(exato); inputBusca.value = ''; listaSugestoes.style.display = 'none'; }
            else if (dados.length === 1) { adicionarAoCarrinho(dados[0]); inputBusca.value = ''; listaSugestoes.style.display = 'none'; }
            else { desenharLista(dados); }
        }
    });

    async function carregarSugestoes(termo) {
        const response = await fetch(`/api/buscar-produto/?termo=${termo}`);
        const dados = await response.json();
        desenharLista(dados);
    }

    function desenharLista(produtos) {
        listaSugestoes.innerHTML = '';
        if (produtos.length === 0) { listaSugestoes.style.display = 'none'; return; }
        produtos.forEach(p => {
            const li = document.createElement('li');
            li.className = 'list-group-item list-group-item-action d-flex justify-content-between cursor-pointer';
            li.style.cursor = 'pointer';
            li.innerHTML = `<div><strong>${p.nome}</strong><br><small>${p.codigo}</small></div><span class="fw-bold">R$ ${p.preco.toFixed(2)}</span>`;
            li.onclick = () => { adicionarAoCarrinho(p); inputBusca.value = ''; listaSugestoes.style.display = 'none'; inputBusca.focus(); };
            listaSugestoes.appendChild(li);
        });
        listaSugestoes.style.display = 'block';
    }

    document.addEventListener('click', e => { if (!inputBusca.contains(e.target) && !listaSugestoes.contains(e.target)) listaSugestoes.style.display = 'none'; });

    // 2. Carrinho
    function adicionarAoCarrinho(produto) {
        const existente = carrinho.find(i => i.id === produto.id);
        if (existente) existente.quantidade++; else carrinho.push({ ...produto, quantidade: 1 });
        renderizarTabela();
    }

    function renderizarTabela() {
        const tbody = document.getElementById('tabela-itens');
        tbody.innerHTML = '';
        let total = 0, qtd = 0;
        carrinho.forEach((item, idx) => {
            const sub = item.preco * item.quantidade;
            total += sub; qtd += item.quantidade;
            tbody.innerHTML += `<tr><td>${idx+1}</td><td>${item.nome}<br><small>${item.codigo}</small></td><td class="text-center"><input type="number" min="1" class="form-control form-control-sm text-center d-inline-block" style="width:60px" value="${item.quantidade}" onchange="atualizarQtd(${idx},this.value)"></td><td class="text-end">R$ ${item.preco.toFixed(2)}</td><td class="text-end fw-bold">R$ ${sub.toFixed(2)}</td><td class="text-center"><button class="btn btn-sm text-danger" onclick="removerItem(${idx})"><i class="bi bi-trash"></i></button></td></tr>`;
        });
        const fmt = total.toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
        document.getElementById('visor-total').innerText = fmt;
        document.getElementById('resumo-total').innerText = fmt;
        document.getElementById('total-itens-badge').innerText = `${qtd} itens`;
    }

    function atualizarQtd(i, v) { if(v<1)return; carrinho[i].quantidade = parseInt(v); renderizarTabela(); }
    function removerItem(i) { carrinho.splice(i, 1); renderizarTabela(); }
    function limparCarrinho() { carrinho = []; renderizarTabela(); inputBusca.focus(); }

    // 3. Finalizar (Manda pro backend e redireciona)
    async function finalizarVenda() {
        if (carrinho.length === 0) { alert("Carrinho vazio!"); return; }
        const res = await fetch('/api/iniciar-venda/', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({carrinho}) });
        const json = await res.json();
        if (json.status === 'sucesso') window.location.href = `/vendas/${json.venda_id}/checkout/`;
        else alert("Erro ao iniciar venda.");
    }
    
    document.addEventListener('keydown', e => { if(e.key === 'F2') finalizarVenda(); });
</script>
{% endblock %}
