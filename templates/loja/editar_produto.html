{% extends "core/base.html" %}

{% block content %}
<div class="container" style="max-width: 900px;">
    
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="text-primary fw-bold"><i class="bi bi-pencil-square me-2"></i>Editar Produto</h2>
        <a href="{% url 'relatorio_estoque' %}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left"></i> Cancelar
        </a>
    </div>

    <div class="panel">
        <form method="post">
            {% csrf_token %}
            
            <div class="row g-4">
                <div class="col-md-12">
                    <label class="form-label fw-bold text-secondary">Nome do Produto</label>
                    {{ form.nome }}
                </div>

                <div class="col-md-6">
                    <label class="form-label fw-bold text-secondary">Categoria</label>
                    {{ form.categoria }}
                </div>

                <div class="col-md-6">
                    <label class="form-label fw-bold text-secondary">Código / SKU</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border"><i class="bi bi-tag-fill"></i></span>
                        <input type="text" name="codigo" id="id_codigo" class="form-control" 
                               value="{{ form.codigo.value|default_if_none:'' }}" maxlength="50">
                    </div>
                </div>

                <div class="col-md-4">
                    <label class="form-label fw-bold text-secondary">Custo (R$)</label>
                    {{ form.preco_compra }}
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-bold text-primary">Venda (R$)</label>
                    {{ form.preco_venda }}
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-bold text-secondary">Estoque</label>
                    {{ form.estoque_atual }}
                </div>

                <div class="col-12">
                    <label class="form-label fw-bold text-secondary">Detalhes</label>
                    {{ form.detalhes }}
                </div>
            </div>

            <hr class="my-4 text-muted">

            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-primary btn-lg shadow-sm">
                    <i class="bi bi-save me-2"></i> Salvar Alterações
                </button>
                <a href="{% url 'excluir_produto' produto.id %}" class="btn btn-outline-danger" onclick="return confirm('Tem certeza que deseja EXCLUIR este produto? Essa ação não pode ser desfeita.')">
                    <i class="bi bi-trash"></i> Excluir Produto
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
