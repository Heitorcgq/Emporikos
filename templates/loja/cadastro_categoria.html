{% extends "core/base.html" %}

{% block content %}
<div class="container" style="max-width: 600px;">
    
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="text-primary fw-bold"><i class="bi bi-tags-fill me-2"></i>Nova Categoria</h2>
        <div>
            <a href="{% url 'cadastro_produto' %}" class="btn btn-primary w-10">
                <i class="bi bi-box-seam"></i> Produtos
            </a>
            <a href="{% url 'frente_caixa' %}" class="btn btn-primary w-10">
                <i class="bi bi-arrow-left"></i> Voltar
            </a>
        </div>
    </div>

    <div class="panel">
        <form method="post">
            {% csrf_token %}
            
            <div class="mb-4">
                <label class="form-label fw-bold text-secondary">Nome da Categoria</label>
                {{ form.nome }}
            </div>

            <div class="d-grid">
                <button type="submit" class="btn btn-primary btn-lg shadow-sm">
                    <i class="bi bi-check-lg me-2"></i> Salvar Categoria
                </button>
            </div>
        </form>
    </div>

    <div class="mt-5">  
        <div class="container" style="max-width: 600px;">
            <h5 class="text-primary fw-bold">Categorias Cadastradas</h5>
            <div class="panel p-0 overflow-hidden">
                <ul class="list-group list-group-flush">
                    {% for cat in categorias %}
                    <li class="list-group-item bg-transparent text-primary">
                        <i class="bi bi-tag me-2"></i> {{ cat.nome }}
                    </li>
                    {% empty %}
                    <li class="list-group-item bg-transparent text-muted text-center py-3">
                        Nenhuma categoria cadastrada.
                    </li>
                    {% endfor %}
                </ul>
            </div>
        </div>
    </div>
</div>
{% endblock %}
